version: 1

work:
  sentinel-production-activation:
    triggers:
      - push

    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: avc-core

    nodes:
      activate:
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "vmi3517816"
          test "$(id -u)" = "0"
          activation_sha="eb51f824af2279ee3eee5daa8572bd54a34b3ca8"
          d="$(mktemp -d /tmp/sentinel-activation-work.XXXXXX)"
          cleanup() { rm -rf -- "$d"; }
          trap cleanup EXIT
          git clone -q https://github.com/Aftergraph/sentinel.git "$d"
          git -C "$d" checkout -q --detach "$activation_sha"
          test "$(git -C "$d" rev-parse HEAD)" = "$activation_sha"
          bash "$d/scripts/ops/activate-production-simplification-verifier.sh"
        timeout_s: 1200
