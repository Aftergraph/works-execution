name: Merge queue enqueue

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enqueue:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body, '<!-- merge-queue:enqueue -->')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enqueue pull request through repository merge policy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --squash
