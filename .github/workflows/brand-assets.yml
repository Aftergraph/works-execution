name: Brand Assets
on:
  pull_request:
    paths: [".github/assets/**","README.md","BRAND.md","brand-assets.json","scripts/verify_brand_assets.py",".github/workflows/brand-assets.yml"]
  push:
    branches: [main]
    paths: [".github/assets/**","README.md","BRAND.md","brand-assets.json","scripts/verify_brand_assets.py"]
permissions:
  contents: read
jobs:
  verify-brand-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: python scripts/verify_brand_assets.py
