name: Go tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Integrity before/after benchmark
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "=== controlled host ==="
            echo "sha=${GITHUB_SHA}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            go version
            uname -a
            lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket|Flags' || true
            echo "=== benchmark ==="
            go test ./services/evidence \
              -run "a^" \
              -bench "Benchmark(Digest|IntegrityPipeline)" \
              -benchmem \
              -count=5
          } | tee integrity-bench.txt
