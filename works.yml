version: 1
work:
  verify:
    triggers: [pull_request]
    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: avc-core
    nodes:
      provision-dry-run:
        run: >-
          set -eu;
          test "$(hostname -s)" = "vmi3517816";
          chmod +x scripts/provision-v21-bridge.sh;
          if [ "$(id -u)" -eq 0 ]; then
            PROVISION_DRY_RUN=1 EXPECTED_VDS_HOST=vmi3517816 ./scripts/provision-v21-bridge.sh;
          else
            sudo -n env PROVISION_DRY_RUN=1 EXPECTED_VDS_HOST=vmi3517816 ./scripts/provision-v21-bridge.sh;
          fi
        timeout_s: 60
