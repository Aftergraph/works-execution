version: 1
work:
  verify:
    triggers: [pull_request]
    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: avc-core
    nodes:
      tg-runtime-source:
        run: >-
          set -eu;
          test "$(hostname -s)" = "vmi3517816";
          if [ "$(id -u)" -eq 0 ]; then P=""; else sudo -n true; P="sudo -n"; fi;
          WD="$($P systemctl show tg-gateway.service -p WorkingDirectory --value | head -n1)";
          test -n "$WD";
          $P test -d "$WD";
          REMOTE="$($P git -C "$WD" remote get-url origin)";
          printf '%s' "$REMOTE" | grep -Eq '^(https://github.com/Aftergraph/trust-gateway.git|git@github.com:Aftergraph/trust-gateway.git)$';
          echo "tg-runtime-source=PASS"
        timeout_s: 30
