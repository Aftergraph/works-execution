version: 1
work:
  verify:
    triggers: [pull_request]
    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: avc-core
    nodes:
      works-envfile-property:
        run: >-
          set -eu;
          test "$(hostname -s)" = "vmi3517816";
          if [ "$(id -u)" -eq 0 ]; then P=""; else sudo -n true; P="sudo -n"; fi;
          RAW="$($P systemctl show works-api.service -p EnvironmentFiles --value | head -n1)";
          test -n "$RAW";
          echo "works-envfile-property=PASS"
        timeout_s: 30
