version: 1

work:
  sentinel-root-authority-diagnostic:
    triggers:
      - push

    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: avc-core

    nodes:
      diagnostic:
        run: |
          set +e
          echo "hostname=$(hostname -s)"
          echo "uid=$(id -u)"
          echo "user=$(id -un)"
          if test -x scripts/ops/works-verifier-credential.sh; then echo "helper=present"; else echo "helper=missing"; fi
          echo "pwd=$(pwd)"
          printf "works_service="
          systemctl is-active works-api.service 2>&1
          printf "works_health_http="
          curl -sS -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:18191/healthz 2>&1
          echo
          echo "helper_status_begin"
          bash scripts/ops/works-verifier-credential.sh status 2>&1
          echo "helper_status_rc=$?"
          echo "helper_status_end"
          exit 42
        timeout_s: 120
