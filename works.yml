# Temporary disk diagnostic. Never merge.
version: 1
work:
  diagnose:
    triggers:
      - push
    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: avc-core
    nodes:
      diagnose:
        run: |
          set -u
          echo '=== df ==='
          df -h / /tmp /var/lib/works 2>&1 || true
          echo '=== /tmp usage ==='
          du -sh /tmp 2>/dev/null || true
          ls -la /tmp | head -40
          echo '=== go-build dirs ==='
          du -sh /tmp/go-build* 2>/dev/null | sort -h | tail -n 15 || true
          echo '=== stale go-build dirs (older than 2h) ==='
          find /tmp -maxdepth 1 -type d -name 'go-build*' -mmin +120 -printf '%T@ %p\n' 2>/dev/null | sort -n | head -n 10 || true
          echo '=== works state dirs ==='
          du -sh /var/lib/works/* 2>/dev/null | sort -h | tail -n 12 || true
        timeout_s: 60
