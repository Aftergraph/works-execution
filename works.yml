version: 1

work:
  verify:
    triggers:
      - pull_request
    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: avc-core
    nodes:
      host-identity:
        run: >-
          set -eu;
          test "$(hostname -s)" = "vmi3517816";
          echo "host=vmi3517816"
        timeout_s: 30
      privilege:
        needs: [host-identity]
        run: >-
          set -eu;
          echo "uid=$(id -u)";
          if [ "$(id -u)" -eq 0 ]; then
            echo "privilege=root";
          else
            sudo -n true;
            echo "privilege=passwordless-sudo";
          fi
        timeout_s: 30
