name: Diagnose WORKS live failure

on:
  pull_request:
    paths:
      - '.github/workflows/diag-works-live.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live Integrity Fabric surface
        shell: bash
        env:
          WORK_ID: wrk_3995b52a8e30d244dc83f6413bba0df2
          WORKS_BASE: https://works.rendetalje.dk
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            "$WORKS_BASE/v1/works/$WORK_ID/evidence" > /tmp/evidence.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/evidence.json'))
          print('BUNDLE_ID=' + str(p.get('bundle_id','')))
          integ=p.get('integrity')
          print('INTEGRITY_PRESENT=' + str(bool(integ)).lower())
          if integ:
              print('CANONICALIZATION=' + str(integ.get('canonicalization','')))
              ds=integ.get('digests') or {}
              primary=ds.get('primary') or {}
              alts=ds.get('alternatives') or []
              print('PRIMARY_ALGORITHM=' + str(primary.get('algorithm','')))
              print('ALTERNATES=' + ','.join(str(x.get('algorithm','')) for x in alts))
          print('SIGNATURE_ALGORITHMS=' + ','.join(str(x.get('algorithm','')) for x in (p.get('signatures') or [])))
          PY
