version: 1
work:
  verify:
    triggers: [pull_request]
    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: avc-core
    nodes:
      deploy-works-v21:
        run: >-
          set -eu;
          test "$(hostname -s)" = "vmi3517816";
          chmod +x scripts/deploy-v21-works.sh;
          if [ "$(id -u)" -eq 0 ]; then
            EXPECTED_VDS_HOST=vmi3517816 EXPECTED_SOURCE_SHA=ab8c1d2a6cc322b3d730b1514b1141b8ee65310c ./scripts/deploy-v21-works.sh;
          else
            sudo -n env EXPECTED_VDS_HOST=vmi3517816 EXPECTED_SOURCE_SHA=ab8c1d2a6cc322b3d730b1514b1141b8ee65310c ./scripts/deploy-v21-works.sh;
          fi
        timeout_s: 900
