version: 1
work:
  verify:
    triggers: [pull_request]
    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: avc-core
    nodes:
      tg-discovery:
        run: >-
          set -eu;
          test "$(hostname -s)" = "vmi3517816";
          if [ "$(id -u)" -ne 0 ]; then sudo -n true; SUDO="sudo -n"; else SUDO=""; fi;
          TG_REPO="$($SUDO systemctl show tg-gateway.service -p WorkingDirectory --value | tr -d '\r')";
          test -n "$TG_REPO";
          test "${TG_REPO#/}" != "$TG_REPO";
          $SUDO git -C "$TG_REPO" rev-parse --git-dir >/dev/null;
          echo "tg-discovery=PASS"
        timeout_s: 30
