version: 1
work:
  verify:
    triggers: [pull_request]
    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: avc-core
    nodes:
      host:
        run: >-
          set -eu;
          test "$(hostname -s)" = "vmi3517816";
          if [ "$(id -u)" -ne 0 ]; then sudo -n true; fi;
          echo "host=PASS"
      tg-repo:
        needs: [host]
        run: >-
          set -eu;
          SUDO="";
          if [ "$(id -u)" -ne 0 ]; then SUDO="sudo -n"; fi;
          $SUDO test -d /root/agent-workforce;
          echo "tg_repo=PASS"
