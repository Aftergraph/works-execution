name: Diagnose WORKS live failure

on:
  pull_request:
    paths:
      - '.github/workflows/diag-works-live.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public WORKS failure evidence
        shell: bash
        env:
          WORK_ID: wrk_f32caf913d13f6e67e4db3ac83a0a235
          WORKS_BASE: https://works.rendetalje.dk
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            "$WORKS_BASE/v1/works/$WORK_ID" > /tmp/work.json
          python3 - <<'PY'
          import json, os
          p=json.load(open('/tmp/work.json'))
          print('WORK_ID=' + str(p.get('id','')))
          print('STATE=' + str(p.get('state','')))
          print('SOURCE_SHA=' + str((p.get('source') or {}).get('sha','')))
          for ev in p.get('evidence') or []:
              details=ev.get('details') or {}
              err=details.get('error')
              print('EVIDENCE node=%s result=%s exit_code=%s lease_lost=%s' % (
                  ev.get('node_id',''), ev.get('result',''),
                  details.get('exit_code',''), details.get('lease_lost','')))
              if err:
                  compact=' '.join(str(err).split())
                  print('ERROR=' + compact[-1800:])
          PY
