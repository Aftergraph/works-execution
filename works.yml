# Temporary promotion diagnostic. Never merge.
version: 1
work:
  diagnose:
    triggers:
      - push
    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: avc-core
    nodes:
      diagnose:
        run: |
          set -u
          echo '=== receipt ==='
          cat /var/lib/works/deployments/works-bootstrap-548c03bd2f77dd55c60c58bbd617f6f1a3fd7a06.json 2>&1 || true
          echo '=== unit journal since 22:36 CEST ==='
          journalctl -u aftergraph-works-bootstrap-548c03bd2f77.service \
            --since '2026-09-25 22:36:00 CEST' --no-pager -n 400 2>&1 | tail -n 300
          echo '=== current binaries ==='
          for p in /root/works-venture/bin/works-api /root/works-venture/bin/works-worker /root/works-venture/bin/works; do
            echo "--- $p ---"
            go version -m "$p" 2>&1 | grep -E 'path|vcs.revision|vcs.modified' || true
            sha256sum "$p" 2>&1 || true
          done
          echo '=== service start times + who restarted at 22:47 ==='
          for s in works-api works-worker works-worker-2 works-worker-3; do
            echo "$s=$(systemctl show "$s.service" -p ExecMainStartTimestamp --value 2>/dev/null)"
          done
          journalctl -u works-api.service --since '2026-09-25 22:40:00 CEST' --until '2026-09-25 22:50:00 CEST' --no-pager -n 60 2>&1 || true
          echo '=== backups dir ==='
          find /var/lib/works/deployments/backups -maxdepth 2 -printf '%M %U:%G %p %s bytes\n' 2>/dev/null || true
        timeout_s: 30
