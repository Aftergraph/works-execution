version: 1

work:
  verify:
    triggers:
      - pull_request
    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: avc-core
    nodes:
      host-identity:
        run: >-
          set -eu;
          echo "host=$(hostname -s)";
          test "$(hostname -s)" = "vmi3517816";
          echo "v21-host-identity=PASS"
        timeout_s: 30
