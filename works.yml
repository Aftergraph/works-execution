# Temporary bootstrap diagnostic pipeline. Never merge.
version: 1
work:
  bootstrap-diagnostic:
    triggers:
      - push
    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: avc-core
    nodes:
      inspect-go-toolchain:
        run: |
          set -euo pipefail
          echo "go_path=$(command -v go)"
          echo "git_path=$(command -v git)"
          echo "curl_path=$(command -v curl)"
          echo "sha256sum_path=$(command -v sha256sum)"
          go version
          go env GOROOT GOPATH
        timeout_s: 20
