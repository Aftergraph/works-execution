version: 1
work:
  verify:
    triggers: [pull_request]
    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: avc-core
    nodes:
      tg-origin-canonical:
        run: >-
          set -eu;
          test "$(hostname -s)" = "vmi3517816";
          if [ "$(id -u)" -eq 0 ]; then P=""; else sudo -n true; P="sudo -n"; fi;
          PID="$($P systemctl show tg-gateway.service -p MainPID --value)";
          URL="$($P git -C "/proc/$PID/cwd" remote get-url origin)";
          printf '%s' "$URL" | grep -Eq '^(https://github.com/Aftergraph/trust-gateway.git|git@github.com:Aftergraph/trust-gateway.git)$';
          echo "tg-origin-canonical=PASS"
        timeout_s: 30
