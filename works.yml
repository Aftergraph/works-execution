version: 1

work:
  diagnose:
    triggers:
      - push
    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: avc-core
    nodes:
      execstart:
        run: |
          set -u
          echo "WHOAMI=$(id -un)"
          echo "UID=$(id -u)"
          echo "PWD=$PWD"
          echo "SERVICE_ACTIVE=$(systemctl is-active works-api.service 2>&1 || true)"
          echo "EXEC_START=$(systemctl show works-api.service -p ExecStart --value 2>&1 || true)"
          echo "FRAGMENT=$(systemctl show works-api.service -p FragmentPath --value 2>&1 || true)"
          echo "MAIN_PID=$(systemctl show works-api.service -p MainPID --value 2>&1 || true)"
          pid="$(systemctl show works-api.service -p MainPID --value 2>/dev/null || true)"
          if [[ "$pid" =~ ^[1-9][0-9]*$ ]]; then
            echo "PROC_EXE=$(readlink -f /proc/$pid/exe 2>&1 || true)"
          fi
          echo "OPT_WORKS_BIN:"
          ls -la /opt/works/bin 2>&1 || true
          echo "SUDO_NONINTERACTIVE=$(sudo -n true >/dev/null 2>&1 && echo yes || echo no)"
          exit 42
        timeout_s: 60
