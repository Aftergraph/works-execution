version: 1

work:
  sentinel-root-authority-probe:
    triggers:
      - push

    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: avc-core

    nodes:
      probe:
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "vmi3517816"
          test "$(id -u)" = "0"
          test -x scripts/ops/works-verifier-credential.sh
          bash scripts/ops/works-verifier-credential.sh status
          systemctl is-active --quiet works-api.service
          curl -fsS --max-time 2 http://127.0.0.1:18191/healthz >/dev/null
          printf '{"host":"vmi3517816","executor_uid":0,"works_health":true,"mutation":false}\n'
        timeout_s: 120
