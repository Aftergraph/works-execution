version: 1
work:
  verify:
    triggers: [pull_request]
    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: avc-core
    nodes:
      stage-probe:
        run: >-
          set -eu;
          stage="$(cat /tmp/aftergraph-v21-activation-stage 2>/dev/null || true)";
          case "$stage" in
            preflight|works-build|tg-release|credentials) exit 0 ;;
            *) exit 1 ;;
          esac
        timeout_s: 30
