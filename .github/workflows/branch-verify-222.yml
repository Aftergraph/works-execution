name: Branch Verify 222

on:
  push:
    branches:
      - feat/placement-binding-222

permissions:
  contents: read

concurrency:
  group: works-branch-verify-222-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normal-track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: make e2e
