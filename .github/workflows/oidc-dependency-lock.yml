name: OIDC dependency lock
on:
  push:
    branches: [feat/github-oidc-worker-enrollment]
    paths:
      - go.mod
      - .github/workflows/oidc-dependency-lock.yml

permissions:
  contents: write

jobs:
  tidy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/github-oidc-worker-enrollment
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.0'
          cache: false
      - name: Update module lock deterministically
        run: |
          set -euo pipefail
          go mod tidy
          go test ./services/api ./internal/worker
          git diff --check
      - name: Commit lockfile only
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add go.mod go.sum
          if git diff --cached --quiet; then
            echo "module_lock=already_clean"
            exit 0
          fi
          git commit -m "chore(auth): lock GitHub OIDC dependencies"
          git push origin HEAD:feat/github-oidc-worker-enrollment
