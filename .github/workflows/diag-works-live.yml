name: Diagnose WORKS live failure

on:
  pull_request:
    paths: ['.github/workflows/diag-works-live.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Find bootstrap Work in public UI
        shell: bash
        env:
          WORKS_BASE: https://works.rendetalje.dk
          SHORT_SHA: 33882c40
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 "$WORKS_BASE/v1/ui" > /tmp/ui
          python3 - <<'PY'
          import os,re
          s=open('/tmp/ui',encoding='utf-8',errors='replace').read()
          n=os.environ['SHORT_SHA']
          print('HAS_SHA='+str(n in s).lower())
          for m in re.finditer(re.escape(n),s):
              c=' '.join(s[max(0,m.start()-1500):min(len(s),m.end()+1500)].split())
              print('CONTEXT='+c[:3000])
          PY
