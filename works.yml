version: 1
work:
  verify:
    triggers: [pull_request]
    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: avc-core
    nodes:
      stage-probe:
        run: >-
          set -eu;
          stage="$(cat /tmp/aftergraph-v21-activation-stage 2>/dev/null || true)";
          test "$stage" = "preflight"
        timeout_s: 30
