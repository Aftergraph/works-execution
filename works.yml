# works.yml — works-execution's own CI pipeline (self-hosted).
#
# This repo builds and verifies ITSELF through its own control plane:
# a push to main triggers a webhook → the control plane creates a
# Work → a BYOC pool runner (avc-core) leases the nodes, runs the
# pipeline below, and the publisher posts the result back to the
# commit as a GitHub status. No GitHub Actions involved — dogfood all
# the way down.
#
# Scope note: Requirements.Pool pins this pipeline to the avc-core
# pool (RFC-0004). cache: true on the vet node lets repeat pushes
# with byte-identical inputs skip straight to the cached result
# (RFC-0005).
version: 1

work:
  verify:
    triggers:
      - push
      - pull_request

    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: avc-core

    nodes:
      p2-live-production-readback:
        run: |
          set -eu
          endpoint=http://127.0.0.1:18191/healthz
          body="$(curl -fsS --max-time 3 "$endpoint")"
          test "$body" = '{"status":"ok"}'
          printf '%s\n' '{"schema":"steward.p2.works-live-readback/1.0","endpoint":"http://127.0.0.1:18191/healthz","health_status":"ok","production_effect":false}'
        timeout_s: 30

      vet:
        needs: [p2-live-production-readback]
        run: go vet ./...
        cache: true
        timeout_s: 120

      test:
        needs: [vet]
        run: go test ./... -count=1
        timeout_s: 600

      windows-worker-crossbuild:
        needs: [test]
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o dist/works-worker-windows-amd64.exe ./cmd/works-worker
          sha256sum dist/works-worker-windows-amd64.exe
        timeout_s: 180

      build:
        needs: [test]
        run: make build
        timeout_s: 120
