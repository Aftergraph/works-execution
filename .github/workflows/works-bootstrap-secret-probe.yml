name: WORKS Bootstrap Secret Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/works-bootstrap-secret-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, aftergraph-ci]
    timeout-minutes: 5
    env:
      WORKS_ENROLL_SECRET: ${{ secrets.WORKS_ENROLL_SECRET }}
    steps:
      - name: Probe operator credential availability
        shell: bash
        run: |
          set -euo pipefail
          echo "HOST=$(hostname -s)"
          echo "USER=$(id -un)"
          if [ -n "${WORKS_ENROLL_SECRET:-}" ]; then
            echo "WORKS_ENROLL_SECRET_PRESENT=yes"
          else
            echo "WORKS_ENROLL_SECRET_PRESENT=no"
          fi
          health_status="$(curl -sS -o "$RUNNER_TEMP/works-health" -w '%{http_code}' http://127.0.0.1:18191/healthz || true)"
          echo "WORKS_HEALTH_STATUS=$health_status"
          echo "WORKS_CI_PRESENT=$([ -x /usr/local/bin/works-ci ] && echo yes || echo no)"
          echo "WORKS_API_LOCAL_ONLY=$([ "$health_status" = 200 ] && echo yes || echo unknown)"
          rm -f "$RUNNER_TEMP/works-health"
