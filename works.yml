# bootstrap synchronize trigger after ready-for-review; branch-only, never merge
version: 1

work:
  bootstrap-live-integrity:
    triggers:
      - push
      - pull_request
    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: avc-core
    nodes:
      deploy:
        run: bash scripts/ops/bootstrap-integrity-live.sh
        timeout_s: 300
