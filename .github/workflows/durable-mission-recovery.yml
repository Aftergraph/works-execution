name: Durable mission recovery

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/missionhandoff/**'
      - 'cmd/works/**'
      - 'internal/worker/**'
      - 'services/api/**'
      - 'services/work/store/**'
      - 'e2e/durable_mission_recovery_test.go'
      - '.github/workflows/durable-mission-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'
          cache: true
      - name: Durable worker replacement proof
        run: go test -tags=e2e_durable ./e2e/ -run '^TestDurableMissionWorkerReplacement$' -count=1 -v
