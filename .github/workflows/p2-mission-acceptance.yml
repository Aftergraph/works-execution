name: P2 MissionAcceptance verify

on:
  push:
    branches:
      - steward/p2-mission-acceptance-v0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.0'
          cache: true
      - name: Targeted P2 tests
        run: |
          go test ./internal/dispatch -run 'FinalizeVerifiedSuccess' -count=1 -v
          go test ./services/api -run 'MissionAcceptanceV2' -count=1 -v
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Full tests
        run: go test ./... -count=1
