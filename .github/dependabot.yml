version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule: {interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/Copenhagen"}
    open-pull-requests-limit: 5
  - package-ecosystem: "docker"
    directory: "/"
    schedule: {interval: "weekly", day: "monday", time: "07:00", timezone: "Europe/Copenhagen"}
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: {interval: "weekly", day: "monday", time: "06:30", timezone: "Europe/Copenhagen"}
    open-pull-requests-limit: 5
