version: 1

work:
  verify:
    triggers:
      - push

    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: avc-core

    nodes:
      provenance:
        run: |
          set -eu
          cd ci/concord-rc2
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { createHash } from "node:crypto";
          const manifest = JSON.parse(await readFile("SOURCE_MANIFEST.json", "utf8"));
          if (manifest.source_commit !== "eb2d95399cbdebb83598bd01a2da9e19e407fca1") {
            throw new Error("source commit mismatch");
          }
          for (const [path, expected] of Object.entries(manifest.files)) {
            const bytes = await readFile(path);
            const actual = createHash("sha1")
              .update("blob " + bytes.length + "\0")
              .update(bytes)
              .digest("hex");
            if (actual !== expected) throw new Error(path + ": blob mismatch " + actual + " != " + expected);
          }
          console.log("CONCORD_SOURCE_COMMIT=" + manifest.source_commit);
          console.log("CONCORD_SOURCE_TREE=" + manifest.source_tree);
          console.log("CONCORD_BLOB_CHECKS=" + Object.keys(manifest.files).length + "/"+Object.keys(manifest.files).length+" PASS");
          NODE
        timeout_s: 120

      core:
        needs: [provenance]
        run: |
          set -eu
          cd ci/concord-rc2
          node --version
          npm --version
          node -e 'if (+process.versions.node.split(".")[0] < 20) { console.error("Node >=20 required"); process.exit(1) }'
          npm run check
          npm test
        timeout_s: 600

      cloudflare_contract:
        needs: [core]
        run: |
          set -eu
          cd ci/concord-rc2
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const c = JSON.parse(await readFile("wrangler.jsonc","utf8"));
          if (c.name !== "aftergraph-concord") throw new Error("worker name mismatch");
          if (c.main !== "src/cloudflare/worker.js") throw new Error("worker main mismatch");
          const binding = c.durable_objects?.bindings?.find((x) => x.name === "CONCORD_STATE" && x.class_name === "ConcordState");
          if (!binding) throw new Error("CONCORD_STATE durable object binding missing");
          if (!c.migrations?.some((m) => m.new_sqlite_classes?.includes("ConcordState"))) throw new Error("SQLite Durable Object migration missing");
          if (c.assets?.directory !== "./public") throw new Error("static assets directory mismatch");
          console.log("CLOUDFLARE_CONTRACT_PASS");
          NODE
        timeout_s: 120


      cloudflare_runtime_probe:
        needs: [cloudflare_contract]
        run: |
          set -eu
          cd ci/concord-rc2
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "CLOUDFLARE_API_TOKEN=present"; else echo "CLOUDFLARE_API_TOKEN=missing"; fi
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then echo "CLOUDFLARE_ACCOUNT_ID=present"; else echo "CLOUDFLARE_ACCOUNT_ID=missing"; fi
          npm install --ignore-scripts --no-audit --no-fund
          npm run cloudflare:check
        timeout_s: 600
