name: Diagnose WORKS live failure

on:
  pull_request:
    paths:
      - '.github/workflows/diag-works-live.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe live WORKS control-plane surfaces
        shell: bash
        env:
          WORKS_BASE: https://works.rendetalje.dk
          WORK_ID: wrk_3995b52a8e30d244dc83f6413bba0df2
        run: |
          set -euo pipefail
          code() { curl --silent --show-error --output /tmp/body --write-out '%{http_code}' --max-time 15 "$@"; }
          echo "HEALTHZ=$(code "$WORKS_BASE/healthz")"
          echo "UI=$(code "$WORKS_BASE/v1/ui")"
          echo "EVIDENCE=$(code "$WORKS_BASE/v1/works/$WORK_ID/evidence")"
          echo "WEBHOOK_UNSIGNED=$(code -X POST -H 'X-GitHub-Event: push' -H 'X-GitHub-Delivery: diag' -H 'Content-Type: application/json' --data '{}' "$WORKS_BASE/v1/webhook/github")"
