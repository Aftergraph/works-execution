name: Diagnose WORKS live failure

on:
  pull_request:
    paths:
      - '.github/workflows/diag-works-live.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public WORKS UI for bootstrap SHA
        shell: bash
        env:
          SHORT_SHA: 643eff7c
          WORKS_BASE: https://works.rendetalje.dk
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            "$WORKS_BASE/v1/ui" > /tmp/ui.html
          python3 - <<'PY'
          import os,re
          s=open('/tmp/ui.html',encoding='utf-8',errors='replace').read()
          needle=os.environ['SHORT_SHA']
          print('HAS_SHA=' + str(needle in s).lower())
          for m in re.finditer(re.escape(needle),s):
              lo=max(0,m.start()-1200); hi=min(len(s),m.end()+1200)
              chunk=' '.join(s[lo:hi].split())
              print('CONTEXT=' + chunk[:2400])
          PY
