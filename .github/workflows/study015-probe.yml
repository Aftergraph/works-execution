name: STUDY-015 Component Probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'
          cache: true
      - name: Run local implementation probe
        run: |
          set -euo pipefail
          go run ./cmd/study015-probe > study015-probe.json
          python3 - <<'PY'
          import json, subprocess
          r=json.load(open("study015-probe.json"))
          head=subprocess.check_output(["git","rev-parse","HEAD"], text=True).strip()
          assert r["schema"]=="study015.probe/1.0"
          assert r["component"]=="works-execution"
          assert r["source_head"]==head
          assert r["network_used"] is False
          assert all(r["mechanisms"].values())
          print("STUDY015_WORKS_PROBE=PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: study015-probe-works-execution-${{ github.sha }}
          path: study015-probe.json
          if-no-files-found: error
          retention-days: 14
