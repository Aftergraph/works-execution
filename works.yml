version: 1
work:
  verify:
    triggers: [pull_request]
    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: avc-core
    nodes:
      live-service-health:
        run: >-
          set -eu;
          test "$(hostname -s)" = "vmi3517816";
          if [ "$(id -u)" -eq 0 ]; then P=""; else sudo -n true; P="sudo -n"; fi;
          test "$($P systemctl is-active works-api.service)" = "active";
          curl -fsS --max-time 2 http://127.0.0.1:18191/healthz >/dev/null;
          test "$($P systemctl is-active tg-gateway.service)" = "active";
          curl -fsS --max-time 2 http://127.0.0.1:8800/healthz >/dev/null;
          echo "live-service-health=PASS"
        timeout_s: 30
