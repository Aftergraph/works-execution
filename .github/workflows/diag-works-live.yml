name: Diagnose WORKS live failure

on:
  pull_request:
    paths: ['.github/workflows/diag-works-live.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read bounded public WORKS bootstrap evidence
        shell: bash
        env:
          WORKS_BASE: https://works.rendetalje.dk
          SOURCE_REF: refs/heads/ops/bootstrap-main-548c03bd
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$WORKS_BASE/v1/works" > /tmp/works.json
          python3 - <<'PY'
          import json, os, re, urllib.request

          base=os.environ['WORKS_BASE']
          ref=os.environ['SOURCE_REF']
          payload=json.load(open('/tmp/works.json', encoding='utf-8'))
          rows=payload if isinstance(payload,list) else payload.get('works',[])
          matches=[w for w in rows if (w.get('source') or {}).get('ref') == ref]
          if not matches:
              print('BOOTSTRAP_FOUND=false')
              raise SystemExit(0)
          work=matches[0]
          wid=work.get('id')
          print('BOOTSTRAP_FOUND=true')
          print('WORK_ID='+str(wid))
          with urllib.request.urlopen(base+'/v1/works/'+wid, timeout=20) as r:
              work=json.load(r)

          secret_patterns = [
              re.compile(r'gh[pousr]_[A-Za-z0-9]{20,}'),
              re.compile(r'sk-[A-Za-z0-9_-]{20,}'),
              re.compile(r'xox[bpsar]-[A-Za-z0-9-]{10,}'),
              re.compile(r'AIza[A-Za-z0-9_-]{35}'),
              re.compile(r'AKIA[A-Z0-9]{16}'),
              re.compile(r'Bearer\s+[A-Za-z0-9._~+/=-]{20,}', re.I),
          ]
          def safe(v, limit=1800):
              s=str(v)
              for p in secret_patterns:
                  s=p.sub('[REDACTED]',s)
              return s[-limit:]

          print('STATE='+safe(work.get('state','')))
          print('SOURCE_SHA='+safe((work.get('source') or {}).get('sha','')))
          for a in work.get('attempts') or []:
              print('ATTEMPT='+json.dumps({
                  'id':a.get('id'),'node_id':a.get('node_id'),'status':a.get('status'),
                  'exit_code':a.get('exit_code'),'worker_id':a.get('worker_id')
              },sort_keys=True))
          for ev in work.get('evidence') or []:
              d=ev.get('details') or {}
              print('EVIDENCE='+json.dumps({
                  'node_id':ev.get('node_id'),'result':ev.get('result'),'signer':ev.get('signer'),
                  'exit_code':d.get('exit_code'),'duration_ms':d.get('duration_ms'),
                  'command':safe(d.get('command',''),500),'error':safe(d.get('error',''),1800),
                  'lease_lost':d.get('lease_lost')
              },sort_keys=True))
          PY
