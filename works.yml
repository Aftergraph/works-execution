# Temporary post-bootstrap verification pipeline. Never merge.
version: 1
work:
  verify-live:
    triggers:
      - push
    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: avc-core
    nodes:
      verify-live-integrity:
        run: |
          set -euo pipefail
          TARGET_SHA=548c03bd2f77dd55c60c58bbd617f6f1a3fd7a06
          receipt=/var/lib/works/deployments/works-bootstrap-$TARGET_SHA.json
          echo '=== receipt ==='
          test -f "$receipt"
          cat "$receipt"
          grep -Fq '"state":"VERIFIED"' "$receipt"
          grep -Fq '"target_sha":"548c03bd2f77dd55c60c58bbd617f6f1a3fd7a06"' "$receipt"
          echo '=== exact binary revisions ==='
          for p in /root/works-venture/bin/works-api /root/works-venture/bin/works-worker /root/works-venture/bin/works; do
            echo "--- $p ---"
            go version -m "$p" | tee /tmp/meta
            grep -Fq 'vcs.revision=548c03bd2f77dd55c60c58bbd617f6f1a3fd7a06' /tmp/meta
            grep -Fq 'vcs.modified=false' /tmp/meta
          done
          echo '=== running process digests ==='
          api_pid=$(systemctl show works-api.service -p MainPID --value)
          worker_pid=$(systemctl show works-worker.service -p MainPID --value)
          sha256sum /proc/$api_pid/exe /root/works-venture/bin/works-api
          sha256sum /proc/$worker_pid/exe /root/works-venture/bin/works-worker
          test "$(sha256sum /proc/$api_pid/exe | awk '{print $1}')" = "$(sha256sum /root/works-venture/bin/works-api | awk '{print $1}')"
          test "$(sha256sum /proc/$worker_pid/exe | awk '{print $1}')" = "$(sha256sum /root/works-venture/bin/works-worker | awk '{print $1}')"
          echo '=== health + runners ==='
          curl -fsS http://127.0.0.1:18191/healthz
          echo
          /root/works-venture/bin/works runners
          echo '=== Integrity Fabric smoke ==='
          curl -fsS http://127.0.0.1:18191/v1/works/wrk_3995b52a8e30d244dc83f6413bba0df2/evidence > /tmp/evidence.json
          grep -Fq '"canonicalization":"aftergraph-json-canonical/1"' /tmp/evidence.json
          grep -Fq '"algorithm":"sha256"' /tmp/evidence.json
          grep -Fq '"algorithm":"blake3"' /tmp/evidence.json
          grep -Fq '"algorithm":"hmac-sha256-v1"' /tmp/evidence.json
          echo 'LIVE_VERIFY=PASS'
        timeout_s: 40
