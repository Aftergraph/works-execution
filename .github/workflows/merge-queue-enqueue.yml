name: Merge queue enqueue

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  enqueue:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body, '<!-- merge-queue:enqueue -->')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enqueue pull request through repository merge policy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api graphql \
            -f query='mutation($id:ID!,$head:GitObjectID!){enqueuePullRequest(input:{pullRequestId:$id,expectedHeadOid:$head}){mergeQueueEntry{id position}}}' \
            -F id="$PR_NODE_ID" \
            -F head="$PR_HEAD_SHA"
